name: Rapport de bug
description: Signaler un comportement inattendu dans UrbanFlow SmartRoute
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Pour une vulnérabilité de sécurité, ne pas utiliser ce formulaire public — voir [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Qu'est-ce qui se passe, et qu'est-ce qui était attendu ?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Constater '...'
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Déploiement de démo (Vercel/Render)
        - Local (npm run dev)
        - Local avec DEMO_MODE=true
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Navigateur / appareil
      placeholder: "Chrome 130 / macOS, Safari iOS 18…"

  - type: textarea
    id: logs
    attributes:
      label: Logs, captures d'écran
      description: Console navigateur, réponse API, capture d'écran si pertinent
